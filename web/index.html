<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2027">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Termux Code - IDE & Terminal</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23181c23'/><path d='M6 8l5 4-5 4M13 16h5' stroke='%2358a6ff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-layout mode-home view-split">
    <!-- Top Navigation Bar -->
    <header class="app-header">
      <div class="header-left">
        <button id="btn-toggle-sidebar" class="btn-icon" title="Toggle File Tree">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="brand">
          <span class="brand-logo">&gt;_</span>
          <span class="brand-title">Termux Code</span>
        </div>

        <!-- Mode Nav Switcher (Home Fullscreen Explorer vs Workspace) -->
        <nav class="nav-mode-group">
          <button id="btn-nav-home" class="nav-mode-btn active" title="Halaman Utama Explorer Fullscreen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
          </button>
          <button id="btn-nav-workspace" class="nav-mode-btn" title="Code Editor &amp; Terminal">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <span>Workspace</span>
          </button>
        </nav>

        <div id="connection-status" class="status-badge status-connecting" title="Backend Status">
          <span class="status-dot"></span>
          <span class="status-text">Connecting</span>
        </div>
      </div>

      <div class="header-right">
        <!-- Layout switches (only active in Workspace mode) -->
        <div id="workspace-layout-controls" class="layout-toggle-group">
          <button id="btn-view-editor" class="btn-icon-text" title="Editor Only">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span class="hide-mobile">Code</span>
          </button>
          <button id="btn-view-split" class="btn-icon-text active" title="Split View (Left Editor, Right Terminal)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="12" y1="3" x2="12" y2="21"></line>
            </svg>
            <span class="hide-mobile">Split</span>
          </button>
          <button id="btn-view-terminal" class="btn-icon-text" title="Terminal Only">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
            <span class="hide-mobile">Term</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="app-body">
      <!-- 1. Halaman Utama: Fullscreen Explorer -->
      <section id="home-view" class="home-view-container">
        <!-- Home Toolbar -->
        <div class="home-toolbar">
          <div class="home-path-row">
            <button id="btn-home-up" class="btn-icon-sm" title="Folder sebelumnya (Up)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
            <div id="home-breadcrumbs" class="home-breadcrumbs">
              <!-- Breadcrumbs injected by JS -->
            </div>
          </div>

          <div class="home-actions-row">
            <div class="home-search-box">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="home-search-input" placeholder="Cari file atau folder..." autocomplete="off">
            </div>

            <button id="btn-home-open-term" class="btn-action-primary" title="Buka folder ini di Terminal">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
              </svg>
              <span>Open in Terminal</span>
            </button>
            <button id="btn-home-open-project" class="btn-action" title="Jadikan folder ini sebagai Project Workspace">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
              <span>Set as Project</span>
            </button>
            <button id="btn-home-new-file" class="btn-action" title="Buat File Baru">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <line x1="12" y1="11" x2="12" y2="17"></line>
                <line x1="9" y1="14" x2="15" y2="14"></line>
              </svg>
              <span>File</span>
            </button>
            <button id="btn-home-new-folder" class="btn-action" title="Buat Folder Baru">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                <line x1="12" y1="11" x2="12" y2="17"></line>
                <line x1="9" y1="14" x2="15" y2="14"></line>
              </svg>
              <span>Folder</span>
            </button>
            <button id="btn-home-refresh" class="btn-icon-sm" title="Refresh">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Fullscreen Explorer Items Container -->
        <div id="home-explorer-list" class="home-explorer-list">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- 2. Halaman Workspace: Editor & Terminal View -->
      <section id="workspace-view" class="workspace-view-container">
        <!-- File Manager Sidebar Drawer -->
        <aside id="file-sidebar" class="sidebar">
          <div class="sidebar-header">
            <div class="sidebar-title-group">
              <span class="sidebar-title">EXPLORER</span>
            </div>
            <div class="sidebar-actions">
              <button id="btn-new-file" class="btn-icon-sm" title="New File">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <line x1="12" y1="11" x2="12" y2="17"></line>
                  <line x1="9" y1="14" x2="15" y2="14"></line>
                </svg>
              </button>
              <button id="btn-new-folder" class="btn-icon-sm" title="New Folder">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                  <line x1="12" y1="11" x2="12" y2="17"></line>
                  <line x1="9" y1="14" x2="15" y2="14"></line>
                </svg>
              </button>
              <button id="btn-refresh-tree" class="btn-icon-sm" title="Refresh">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="23 4 23 10 17 10"></polyline>
                  <polyline points="1 20 1 14 7 14"></polyline>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Scope Switcher: Project Only vs All/Root (~) -->
          <div class="sidebar-scope-bar">
            <div class="scope-toggle-group">
              <button id="btn-scope-project" class="scope-toggle-btn active" title="Tampilkan Hanya Project Ini">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <span class="scope-toggle-text">Project</span>
              </button>
              <button id="btn-scope-root" class="scope-toggle-btn" title="Tampilkan Semua Folder (~ Home / Root)">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                  <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="scope-toggle-text">Root (~)</span>
              </button>
            </div>
          </div>

          <!-- Current Root / Project Banner -->
          <div class="sidebar-root-header">
            <div class="sidebar-root-info" id="sidebar-root-info" title="Current Workspace Scope">
              <span class="sidebar-root-icon" id="sidebar-root-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="#e5c07b"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
              </span>
              <span class="sidebar-root-name" id="sidebar-root-name">termux-code</span>
              <span class="sidebar-root-badge" id="sidebar-root-badge">Project</span>
            </div>
            <button id="btn-switch-project" class="btn-icon-sm" title="Ganti Project / Pilih Folder Lain">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </div>

          <div id="file-tree" class="file-tree-container">
            <!-- Tree nodes dynamically loaded -->
          </div>
        </aside>

        <!-- Sidebar Backdrop for Mobile overlay -->
        <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

        <!-- Editor & Terminal Content Panel (Left-Right Split) -->
        <div class="content-panel">
          <!-- Editor Section (Left) -->
          <section id="editor-section" class="editor-container">
            <div class="editor-header">
              <div id="editor-tabs" class="tab-bar">
                <!-- Dynamically populated tabs -->
              </div>
            </div>
            
            <div id="cm-editor" class="codemirror-wrapper">
              <div id="empty-editor-placeholder" class="empty-placeholder">
                <div class="placeholder-icon">&lt;/&gt;</div>
                <div class="placeholder-text">Pilih berkas dari Explorer untuk mulai mengedit</div>
                <div class="placeholder-hint">Termux Code IDE &amp; Agent CLI</div>
              </div>
            </div>

            <!-- Floating Unsaved Changes Pill at Bottom Center -->
            <div id="editor-unsaved-dock" class="editor-unsaved-dock" style="display: none;">
              <div class="dock-badge">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e5c07b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <span class="dock-title">Unsaved changes</span>
              </div>
              <div class="dock-actions">
                <button id="btn-dock-diff" class="dock-btn-text" type="button">View changes</button>
                <button id="btn-dock-discard" class="dock-btn-text dock-btn-discard" type="button">Discard</button>
                <button id="btn-dock-save" class="dock-btn-save" type="button">Save</button>
              </div>
            </div>
          </section>

          <!-- Divider Bar between Editor and Terminal -->
          <div id="panel-resizer" class="panel-resizer">
            <div class="resizer-handle"></div>
          </div>

          <!-- Terminal Section (Right) -->
          <section id="terminal-section" class="terminal-container">
            <div class="terminal-header">
              <div class="terminal-tabs-wrapper">
                <div id="terminal-tabs" class="tab-bar">
                  <!-- Dynamically populated terminal tabs: [ >_ bash 1 × ] [ >_ bash 2 × ] -->
                </div>
                <button id="btn-new-terminal" class="btn-new-tab" title="Buka Sesi Terminal Baru (+)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
              </div>
              <div class="terminal-actions">
                <button id="btn-term-focus" class="btn-icon-sm" title="Focus Keyboard">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                    <line x1="6" y1="8" x2="6" y2="8"></line>
                    <line x1="10" y1="8" x2="10" y2="8"></line>
                    <line x1="14" y1="8" x2="14" y2="8"></line>
                    <line x1="18" y1="8" x2="18" y2="8"></line>
                    <line x1="6" y1="12" x2="6" y2="12"></line>
                    <line x1="10" y1="12" x2="10" y2="12"></line>
                    <line x1="14" y1="12" x2="14" y2="12"></line>
                    <line x1="18" y1="12" x2="18" y2="12"></line>
                    <line x1="8" y1="16" x2="16" y2="16"></line>
                  </svg>
                </button>
                <button id="btn-term-clear" class="btn-icon-sm" title="Clear Terminal">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                  </svg>
                </button>
              </div>
            </div>

            <div id="terminal-wrapper" class="terminal-wrapper">
              <!-- Session containers dynamically injected by JS -->
            </div>

            <!-- Quick Command Input Bar for Mobile & Desktop -->
            <div class="terminal-input-bar">
              <textarea id="terminal-cmd-input" class="cmd-input" placeholder="Ketik perintah atau chat (e.g. ls, claude, git)..." rows="1" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea>
              
              <!-- Hidden Native File Input for Uploading Files from Device -->
              <input type="file" id="terminal-file-input" style="display: none;" multiple>

              <!-- Attach File Dropdown & Button (Beside Send Button) -->
              <div class="attach-wrapper">
                <button id="btn-attach-file" class="btn-attach" type="button" title="Attach file ke terminal (upload dari HP / pilih dari project)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                  </svg>
                  <span>Attach</span>
                </button>

                <!-- Attach Menu Popup -->
                <div id="attach-dropdown-menu" class="attach-dropdown-menu" style="display: none;">
                  <button id="attach-opt-device" class="attach-menu-item" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#61afef" stroke-width="2">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                      <polyline points="17 8 12 3 7 8"></polyline>
                      <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <div class="attach-menu-item-text">
                      <span class="attach-menu-title">Upload dari HP / Device</span>
                      <span class="attach-menu-desc">Simpan berkas ke direktori terminal &amp; sisipkan path</span>
                    </div>
                  </button>
                  <button id="attach-opt-workspace" class="attach-menu-item" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5c07b" stroke-width="2">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                      <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <div class="attach-menu-item-text">
                      <span class="attach-menu-title">Pilih dari Workspace</span>
                      <span class="attach-menu-desc">Sisipkan path berkas yang ada di project</span>
                    </div>
                  </button>
                </div>
              </div>

              <button id="btn-send-cmd" class="btn-send" title="Send to terminal">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                <span>Kirim</span>
              </button>
            </div>

            <!-- Mobile Virtual Key Toolbar (Always reachable on phones) -->
            <div id="virtual-keyboard-bar" class="vkey-bar">
              <button class="vkey vkey-enter" data-key="ENTER">
                <span>ENTER</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-left:3px">
                  <polyline points="9 10 4 15 9 20"></polyline>
                  <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
                </svg>
              </button>
              <button class="vkey" data-key="TAB">TAB</button>
              <button class="vkey" data-key="ESC">ESC</button>
              <button class="vkey vkey-ctrl" data-key="CTRL">CTRL</button>
              <button class="vkey vkey-alt" data-key="ALT">ALT</button>
              <button class="vkey vkey-action" data-action="ctrl-c">^C</button>
              <button class="vkey vkey-action" data-action="ctrl-d">^D</button>
              <button class="vkey" data-key="BACKSPACE" title="Backspace">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                  <line x1="18" y1="9" x2="12" y2="15"></line>
                  <line x1="12" y1="9" x2="18" y2="15"></line>
                </svg>
              </button>
              <button class="vkey" data-char=" ">SPACE</button>
              <button class="vkey" data-key="UP" title="Up">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
              </button>
              <button class="vkey" data-key="DOWN" title="Down">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <button class="vkey" data-key="LEFT" title="Left">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
              </button>
              <button class="vkey" data-key="RIGHT" title="Right">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </button>
              <button class="vkey" data-char="|">|</button>
              <button class="vkey" data-char="~">~</button>
              <button class="vkey" data-char="/">/</button>
              <button class="vkey" data-char="-">-</button>
              <button class="vkey" data-char="_">_</button>
            </div>
          </section>
        </div>
      </section>
    </main>

    <!-- Context Menu for Three-Dots Action -->
    <div id="item-context-menu" class="context-menu" style="display: none;">
      <div class="ctx-header">
        <span id="ctx-item-icon" class="ctx-header-icon"></span>
        <span id="ctx-item-name" class="ctx-header-title">Item Name</span>
      </div>
      <div class="ctx-menu-list">
        <!-- Folder specific options -->
        <button id="ctx-opt-open-project" class="ctx-item" data-action="open-as-project">
          <span class="ctx-item-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5c07b" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </span>
          <div class="ctx-item-text">
            <span class="ctx-item-label">Buka sebagai Project di Workspace</span>
            <span class="ctx-item-desc">Fokuskan Explorer Workspace ke folder ini</span>
          </div>
        </button>
        <button id="ctx-opt-open-term" class="ctx-item" data-action="open-term">
          <span class="ctx-item-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#61afef" stroke-width="2">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
          </span>
          <div class="ctx-item-text">
            <span class="ctx-item-label">Open in Terminal</span>
            <span class="ctx-item-desc">Masuk direktori ini di shell Termux</span>
          </div>
        </button>
        <button id="ctx-opt-run-agent" class="ctx-item" data-action="run-agent">
          <span class="ctx-item-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#98c379" stroke-width="2">
              <rect x="4" y="4" width="16" height="16" rx="2"></rect>
              <rect x="9" y="9" width="2" height="2" fill="#98c379"></rect>
              <rect x="13" y="9" width="2" height="2" fill="#98c379"></rect>
              <line x1="9" y1="15" x2="15" y2="15"></line>
              <line x1="12" y1="2" x2="12" y2="4"></line>
            </svg>
          </span>
          <div class="ctx-item-text">
            <span class="ctx-item-label">Launch Agent CLI Here</span>
            <span class="ctx-item-desc">Jalankan AI Agent di folder ini</span>
          </div>
        </button>
        <button id="ctx-opt-new-file" class="ctx-item" data-action="new-file-inside">
          <span class="ctx-item-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#abb2bf" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <line x1="12" y1="11" x2="12" y2="17"></line>
              <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>
          </span>
          <div class="ctx-item-text">
            <span class="ctx-item-label">New File Inside</span>
            <span class="ctx-item-desc">Buat berkas di dalam folder ini</span>
          </div>
        </button>
        <button id="ctx-opt-new-folder" class="ctx-item" data-action="new-folder-inside">
          <span class="ctx-item-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5c07b" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              <line x1="12" y1="11" x2="12" y2="17"></line>
              <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>
          </span>
          <div class="ctx-item-text">
            <span class="ctx-item-label">New Folder Inside</span>
            <span class="ctx-item-desc">Buat subfolder di dalam folder ini</span>
          </div>
        </button>

        <!-- File specific options -->
        <button id="ctx-opt-open-editor" class="ctx-item" data-action="open-editor">
          <span class="ctx-item-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#61afef" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </span>
          <div class="ctx-item-text">
            <span class="ctx-item-label">Open in Editor</span>
            <span class="ctx-item-desc">Buka &amp; edit di CodeMirror 6</span>
          </div>
        </button>

        <!-- Common options -->
        <div class="ctx-divider"></div>
        <button id="ctx-opt-rename" class="ctx-item" data-action="rename">
          <span class="ctx-item-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d19a66" stroke-width="2">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
          </span>
          <div class="ctx-item-text">
            <span class="ctx-item-label">Rename</span>
            <span class="ctx-item-desc">Ubah nama berkas atau folder</span>
          </div>
        </button>
        <button id="ctx-opt-duplicate" class="ctx-item" data-action="duplicate">
          <span class="ctx-item-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c678dd" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </span>
          <div class="ctx-item-text">
            <span class="ctx-item-label">Duplicate</span>
            <span class="ctx-item-desc">Gandakan berkas/folder ini</span>
          </div>
        </button>
        <button id="ctx-opt-copy-path" class="ctx-item" data-action="copy-path">
          <span class="ctx-item-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#61afef" stroke-width="2">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
          </span>
          <div class="ctx-item-text">
            <span class="ctx-item-label">Copy Path</span>
            <span class="ctx-item-desc">Salin path absolut ke clipboard</span>
          </div>
        </button>
        <div class="ctx-divider"></div>
        <button id="ctx-opt-delete" class="ctx-item ctx-danger" data-action="delete">
          <span class="ctx-item-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e06c75" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </span>
          <div class="ctx-item-text">
            <span class="ctx-item-label">Delete</span>
            <span class="ctx-item-desc">Hapus secara permanen</span>
          </div>
        </button>
      </div>
    </div>
    <div id="ctx-backdrop" class="ctx-backdrop" style="display: none;"></div>

    <!-- Toast Notification for Copy Path / Actions -->
    <div id="app-toast" class="app-toast" style="display: none;"></div>

    <!-- Diff Viewer Modal -->
    <div id="diff-modal-backdrop" class="modal-backdrop" style="display: none;"></div>
    <div id="diff-modal" class="modal-dialog" style="display: none;">
      <div class="modal-header">
        <div class="modal-title-group">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#61afef" stroke-width="2">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          <span id="diff-modal-title">Perubahan Berkas</span>
        </div>
        <button id="btn-close-diff-modal" class="btn-icon-sm" title="Tutup">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="diff-content" class="diff-modal-content"></div>
      <div class="modal-footer">
        <button id="btn-diff-discard" class="btn-secondary" type="button">Discard</button>
        <button id="btn-diff-save" class="btn-primary" type="button">Save Changes</button>
      </div>
    </div>

    <!-- Project Switcher Popover / Modal -->
    <div id="project-picker-backdrop" class="modal-backdrop" style="display: none;"></div>
    <div id="project-picker-modal" class="modal-dialog project-picker-dialog" style="display: none;">
      <div class="modal-header">
        <div class="modal-title-group">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5c07b" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Pilih Project Workspace</span>
        </div>
        <button id="btn-close-project-picker" class="btn-icon-sm" title="Tutup">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="project-picker-list" class="project-picker-list">
        <!-- Injected dynamically by JS -->
      </div>
      <div class="modal-footer project-picker-footer">
        <button id="btn-pick-custom-path" class="btn-secondary" type="button" title="Ketik path folder custom">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span>Ketik Path Folder</span>
        </button>
        <button id="btn-browse-in-home" class="btn-primary" type="button" title="Buka Home Explorer untuk memilih folder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Pilih via Home</span>
        </button>
      </div>
    </div>

    <!-- Workspace File Picker Modal (for Attaching Project Files to Terminal) -->
    <div id="workspace-picker-backdrop" class="modal-backdrop" style="display: none;"></div>
    <div id="workspace-picker-modal" class="modal-dialog project-picker-dialog" style="display: none;">
      <div class="modal-header">
        <div class="modal-title-group">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e5c07b" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>Pilih Berkas Workspace</span>
        </div>
        <button id="btn-close-workspace-picker" class="btn-icon-sm" title="Tutup">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div style="padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); background: rgba(0,0,0,0.15);">
        <input type="text" id="workspace-picker-search" class="cmd-input" placeholder="Cari nama berkas di project..." style="width: 100%;">
      </div>
      <div id="workspace-picker-list" class="project-picker-list" style="max-height: 280px; overflow-y: auto;">
        <!-- Injected dynamically by JS -->
      </div>
    </div>
  </div>

  <!-- Vendor Scripts -->
  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script src="vendor/xterm-addon-web-links.js"></script>
  <script src="vendor/codemirror.bundle.js"></script>

  <!-- App Core -->
  <script src="app.js"></script>
</body>
</html>
